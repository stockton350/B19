<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DeepSpeak">
  <meta name="theme-color" content="#0b0d14">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>DeepSpeak</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0b0d14;
      --surface:    #151923;
      --surface-2:  #1c2132;
      --surface-3:  #252d42;
      --accent:     #4177f6;
      --text:       #f0f2f7;
      --text-2:     #8a94a8;
      --text-3:     #4a5568;
      --border:     rgba(255,255,255,0.07);
      --danger:     #ff453a;
      --font:       -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      --r-sm:       8px;
      --r-md:       12px;
      --r-lg:       16px;
      --r-full:     9999px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
    }

    /* ── Screens ── */
    .screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
    .screen.active { display: flex; }

    #scr-main {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      height: auto;
    }

    /* ── Settings screen ── */
    .settings-top {
      padding: 54px 20px 14px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      position: relative;
    }
    #settings-back-btn {
      width: 32px; height: 32px;
      background: var(--surface-2);
      border: none; border-radius: var(--r-full);
      color: var(--text); font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-right: 12px;
    }
    .settings-top-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
    }

    .settings-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 4px 16px 48px;
    }

    .s-section { margin-bottom: 28px; }
    .s-section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.7px;
      color: var(--text-3);
      text-transform: uppercase;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .s-card {
      background: var(--surface);
      border-radius: var(--r-md);
      overflow: hidden;
    }
    .s-card-pad { padding: 14px 16px; }
    .s-card-no-divider .s-row { border-bottom: none; }

    /* Row-style items */
    .s-row {
      display: flex;
      align-items: center;
      padding: 13px 16px;
      gap: 12px;
      border: none;
      border-bottom: 1px solid var(--border);
      min-height: 50px;
      background: none;
      width: 100%;
      text-align: left;
      cursor: default;
      font-family: var(--font);
    }
    .s-row:last-child { border-bottom: none; }
    button.s-row { cursor: pointer; outline: none; }
    button.s-row:active { background: var(--surface-2); }
    button.s-row.on .s-row-label { color: var(--accent); }
    .s-card-no-divider .s-row { border: none; }

    .app-info-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border-radius: var(--r-md);
      padding: 14px 16px;
      margin-bottom: 28px;
    }
    .app-info-avatar {
      width: 52px; height: 52px;
      background: #e8edf5;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .app-info-avatar img { width: 100%; height: 100%; object-fit: contain; }
    .app-info-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }
    .app-info-version {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 2px;
    }

    .s-row-icon {
      font-size: 15px;
      width: 26px;
      text-align: center;
      flex-shrink: 0;
    }
    .s-row-label {
      flex: 1;
      font-size: 15px;
      color: var(--text);
      font-weight: 500;
    }
    .s-row-value {
      font-size: 14px;
      color: var(--text-2);
    }
    .s-chevron {
      font-size: 16px;
      color: var(--text-3);
      margin-left: 2px;
    }

    /* Inline text input inside a row */
    .s-input {
      background: none;
      border: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      text-align: right;
      min-width: 0;
      flex: 1;
      max-width: 200px;
    }
    .s-input::placeholder { color: var(--text-3); }
    .s-input.err { color: var(--danger); }
    .s-input.err::placeholder { color: var(--danger); }
    select.s-input { -webkit-appearance: none; appearance: none; cursor: pointer; }

    /* Segmented control */
    .seg-ctrl {
      display: flex;
      background: var(--surface-2);
      border-radius: var(--r-sm);
      padding: 3px;
      gap: 2px;
    }
    .seg-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-2);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 4px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .seg-btn.on { background: var(--accent); color: #fff; }
    .seg-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .persona-desc {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.5;
      margin-top: 10px;
      min-height: 40px;
    }

    /* Action buttons */
    .action-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      cursor: pointer;
      border-radius: var(--r-md);
      margin-top: 4px;
    }
    .action-btn:active { opacity: 0.85; }

    .outline-btn {
      width: 100%;
      background: var(--surface);
      color: var(--text-2);
      border: none;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 500;
      padding: 14px;
      cursor: pointer;
      border-radius: var(--r-md);
      margin-top: 10px;
    }
    .outline-btn:active { background: var(--surface-2); color: var(--text); }

    .danger-link {
      font-size: 15px;
      color: var(--danger);
      text-align: center;
      cursor: pointer;
      padding: 14px;
      margin-top: 4px;
    }

    #update-hint {
      font-size: 12px;
      color: var(--text-3);
      text-align: center;
      margin-top: 6px;
      min-height: 16px;
      letter-spacing: 0.3px;
    }

    /* ── Loading screen ── */
    .load-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
    }
    .load-avatar {
      width: 80px; height: 80px;
      background: #e8edf5;
      border-radius: var(--r-full);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }
    .load-avatar svg { width: 54px; height: 44px; }
    #load-msg {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-2);
    }
    .progress-track {
      width: 200px;
      height: 2px;
      background: var(--surface-3);
      border-radius: var(--r-full);
    }
    #progress-fill {
      height: 2px;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
      border-radius: var(--r-full);
    }
    #progress-pct {
      font-size: 12px;
      color: var(--text-3);
    }

    /* ── Main / Chat screen ── */
    .chat-hdr {
      display: flex;
      align-items: center;
      padding: 12px 8px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .chat-hdr-center {
      flex: 1;
      text-align: center;
      min-width: 0;
    }
    .chat-hdr-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
    }
    .chat-hdr-sub {
      font-size: 11px;
      color: var(--text-2);
      margin-top: 1px;
      letter-spacing: 0.3px;
    }
    .icon-btn {
      background: none; border: none;
      color: var(--text-2); font-size: 22px;
      padding: 6px 10px; cursor: pointer; line-height: 1;
      flex-shrink: 0;
    }
    .icon-btn:active { color: var(--text); }

    /* Session summary bar */
    .session-summary {
      padding: 6px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-2);
      flex-shrink: 0;
      background: var(--surface);
    }
    .summary-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
    .summary-date  { color: var(--text-3); flex-shrink: 0; margin-left: 8px; }

    /* Context banner */
    .context-banner {
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      background: var(--surface);
      flex-shrink: 0;
    }
    .context-banner-label {
      font-size: 10px;
      letter-spacing: 0.5px;
      color: var(--text-3);
      margin-bottom: 3px;
    }
    .context-banner-text {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.4;
    }

    /* Chat history */
    .chat-history {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 0 4px;
      display: flex;
      flex-direction: column;
    }

    /* Empty state */
    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 32px 24px;
    }
    .chat-empty-avatar {
      width: 90px; height: 90px;
      background: #e8edf5;
      border-radius: var(--r-full);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
    }
    .chat-empty-avatar svg { width: 60px; height: 48px; }
    .chat-empty-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .chat-empty-sub {
      font-size: 15px;
      color: var(--text-2);
    }

    /* Message bubbles */
    .msg { display: flex; padding: 3px 14px; }
    .msg.user      { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      font-size: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: var(--r-lg);
    }
    .msg.user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: var(--surface);
      color: var(--text);
      border-bottom-left-radius: 4px;
      position: relative;
      padding-bottom: 30px;
    }

    .copy-btn, .speak-btn {
      position: absolute;
      bottom: 6px;
      background: none;
      border: none;
      color: var(--text-3);
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      padding: 2px 5px;
      line-height: 1;
      border-radius: 4px;
    }
    .copy-btn  { right: 6px; }
    .speak-btn { right: 30px; }
    .copy-btn:active, .speak-btn:active { color: var(--text-2); background: var(--surface-2); }
    .speak-btn.speaking { color: var(--accent); }

    .bubble.streaming::after {
      content: '▌';
      animation: blink 0.7s step-end infinite;
      color: var(--accent);
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* Input zone */
    .input-zone { flex-shrink: 0; padding: 8px 16px 24px; }

    /* Mode pills */
    .mode-pills-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }
    .mode-pills {
      display: flex;
      background: var(--surface);
      border-radius: var(--r-full);
      padding: 3px;
      gap: 1px;
    }
    .mode-pill {
      background: none;
      border: none;
      color: var(--text-2);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: var(--r-full);
      transition: background 0.15s, color 0.15s;
      display: flex; align-items: center; gap: 4px;
    }
    .mode-pill.on { background: var(--accent); color: #fff; }
    .mode-pill:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Text input */
    .text-area {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--surface);
      border-radius: 22px;
      padding: 8px 8px 8px 16px;
    }
    .text-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      padding: 4px 0;
      outline: none;
      resize: none;
      overflow-y: hidden;
      line-height: 1.4;
      min-height: 28px;
      max-height: 96px;
    }
    .text-input::placeholder { color: var(--text-3); }
    .send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 17px;
      width: 34px; height: 34px;
      border-radius: var(--r-full);
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .send-btn:disabled { background: var(--surface-3); color: var(--text-3); cursor: not-allowed; }
    .send-btn:not(:disabled):active { opacity: 0.8; }

    /* PTT area */
    .ptt-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 16px 4px;
      gap: 10px;
      min-height: 100px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: none;
    }
    #bars { display: flex; align-items: center; gap: 4px; height: 52px; }
    .bar {
      width: 3px; height: 4px;
      background: var(--accent);
      border-radius: 2px;
      transition: height 0.04s, opacity 0.04s;
    }
    .ptt-status {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-2);
    }
    .dbg-line {
      font-size: 10px;
      color: var(--text-3);
      min-height: 14px;
      text-align: center;
    }

    /* ── Sidebar (full-screen) ── */
    .sidebar-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 10;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 100%;
      background: var(--bg);
      z-index: 11;
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-hdr {
      padding: 52px 16px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .sidebar-hdr-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-2);
      flex: 1;
      text-transform: uppercase;
    }
    .sidebar-hdr-btn {
      background: none; border: none;
      color: var(--text-2); font-size: 20px;
      padding: 4px 6px; cursor: pointer; line-height: 1;
    }
    .sidebar-hdr-btn:active { color: var(--text); }

    .sidebar-new-btn {
      margin: 4px 16px 12px;
      background: var(--surface-2);
      border: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      font-weight: 500;
      padding: 13px 16px;
      cursor: pointer;
      border-radius: var(--r-md);
      text-align: left;
      display: flex; align-items: center; gap: 8px;
    }
    .sidebar-new-btn:active { background: var(--surface-3); }

    .session-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px; }

    .session-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .session-item:active { opacity: 0.6; }
    .session-item-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .session-item-date {
      font-size: 13px;
      color: var(--text-2);
    }
    .session-empty {
      padding: 24px 0;
      font-size: 14px;
      color: var(--text-3);
    }

    .sidebar-footer {
      padding: 12px 16px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .sidebar-persona-avatar {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: var(--r-full);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .sidebar-footer-info { flex: 1; min-width: 0; }
    .sidebar-footer-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .sidebar-footer-model {
      font-size: 12px;
      color: var(--text-3);
    }

    .ftr {
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: center;
      font-size: 12px;
      color: var(--text-3);
      flex-shrink: 0;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- ── SETTINGS SCREEN ─────────────────────────────────────────────────── -->
  <div id="scr-settings" class="screen active">

    <div class="settings-top">
      <button id="settings-back-btn">✕</button>
      <div class="settings-top-title">Settings</div>
    </div>

    <div class="settings-body">

      <div class="app-info-card">
        <div class="app-info-avatar">
          <img src="whale1_192x192.png" style="width:100%;height:100%;object-fit:contain">
        </div>
        <div>
          <div class="app-info-name">DeepSpeak</div>
          <div class="app-info-version">v0.3.0 · BUILD 2026.5.22</div>
        </div>
      </div>

      <div class="s-section">
        <div class="s-section-label">API Keys</div>
        <div class="s-card">
          <div class="s-row">
            <span class="s-row-label">LLM</span>
            <input id="api-key" class="s-input" type="password" placeholder="sk-••••••••••" autocomplete="off" spellcheck="false">
          </div>
          <div class="s-row">
            <span class="s-row-label">TTS</span>
            <input id="openrouter-key" class="s-input" type="password" placeholder="sk-or-••••••••••" autocomplete="off" spellcheck="false">
          </div>
          <div class="s-row">
            <span class="s-row-label">Google Sheet URL</span>
            <input id="memory-url" class="s-input" type="text" placeholder="optional" autocomplete="off" spellcheck="false">
          </div>
        </div>
      </div>

      <div class="s-section">
        <div class="s-section-label">Persona</div>
        <div class="s-card s-card-pad">
          <div class="seg-ctrl">
            <button class="seg-btn p-btn" data-p="SPARK">Spark</button>
            <button class="seg-btn p-btn" data-p="NOVA">Nova</button>
            <button class="seg-btn p-btn" data-p="ECHO">Echo</button>
          </div>
          <div class="persona-desc" id="persona-desc"></div>
        </div>
      </div>

      <div class="s-section">
        <div class="s-section-label">Voice</div>
        <div class="s-card">
          <div class="s-row">
            <span class="s-row-label">Voice</span>
            <select id="settings-voice" class="s-input"></select>
          </div>
        </div>
      </div>

      <div class="s-section">
        <div class="s-section-label">Response</div>
        <div class="s-card s-card-pad">
          <div class="seg-ctrl">
            <button class="seg-btn p-btn rl-btn" data-rl="BRIEF">Brief</button>
            <button class="seg-btn p-btn rl-btn" data-rl="CONCISE">Concise</button>
            <button class="seg-btn p-btn rl-btn" data-rl="VERBOSE">Verbose</button>
          </div>
        </div>
      </div>

      <div class="s-section">
        <div class="s-section-label">Data</div>
        <div class="s-card s-card-no-divider">
          <button id="import-btn" class="s-row">
            <span class="s-row-label">Import keys</span>
            <span class="s-chevron">›</span>
          </button>
          <button id="export-btn" class="s-row">
            <span class="s-row-label">Export keys</span>
            <span class="s-chevron">›</span>
          </button>
          <button id="debug-btn" class="s-row">
            <span class="s-row-label">Debug console</span>
          </button>
        </div>
      </div>

      <button id="init-btn" class="action-btn">Start</button>
      <button id="checkin-btn" class="outline-btn">Memory check-in</button>
      <button id="update-btn" class="outline-btn">Check for update</button>
      <div id="update-hint"></div>

      <div class="danger-link" onclick="localStorage.clear();location.reload()">Clear all data</div>

    </div>

    <div class="ftr">DeepSpeak · v0.3.0 · DeepSeek</div>
  </div>

  <!-- ── LOADING SCREEN ─────────────────────────────────────────────────── -->
  <div id="scr-loading" class="screen">
    <div class="load-body">
      <div class="load-avatar">
        <img src="whale1_192x192.png" style="width:100%;height:100%;object-fit:contain">
      </div>
      <div id="load-msg">Initializing...</div>
      <div class="progress-track"><div id="progress-fill"></div></div>
      <div id="progress-pct">0%</div>
    </div>
  </div>

  <!-- ── MAIN SCREEN ────────────────────────────────────────────────────── -->
  <div id="scr-main" class="screen">

    <div class="chat-hdr">
      <button class="icon-btn" id="menu-btn" aria-label="Sessions">≡</button>
      <div class="chat-hdr-center">
        <div class="chat-hdr-title" id="hdr-chat-title">New chat</div>
        <div class="chat-hdr-sub" id="hdr-persona">DeepSeek</div>
      </div>
      <button id="gear-btn" style="display:none" aria-label="Settings"></button>
    </div>

    <div id="session-summary" class="session-summary" style="display:none">
      <span id="summary-title" class="summary-title"></span>
      <span id="summary-date"  class="summary-date"></span>
    </div>

    <div id="context-banner" class="context-banner" style="display:none"></div>

    <div id="chat-history" class="chat-history">
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-avatar">
          <img src="whale1_192x192.png" style="width:100%;height:100%;object-fit:contain">
        </div>
        <div class="chat-empty-title">Hi, I'm DeepSpeak.</div>
        <div class="chat-empty-sub">How can I help you today?</div>
      </div>
    </div>

    <div id="input-zone" class="input-zone">

      <div class="mode-pills-wrap">
        <div class="mode-pills">
          <button class="mode-pill on" data-mode="text">Text</button>
          <button class="mode-pill"    data-mode="ptt">PTT</button>
          <button class="mode-pill"    data-mode="auto">Auto</button>
        </div>
      </div>

      <div id="text-area" class="text-area">
        <textarea id="text-input" class="text-input" rows="1" placeholder="Message DeepSpeak..."></textarea>
        <button id="send-btn" class="send-btn" aria-label="Send">↑</button>
      </div>

      <div id="ptt-area" class="ptt-area" style="display:none">
        <div id="bars"></div>
        <div id="ptt-status" class="ptt-status">Hold to talk</div>
        <div id="dbg-line" class="dbg-line"></div>
      </div>

    </div>
  </div>

  <!-- ── SIDEBAR ─────────────────────────────────────────────────────────── -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <div id="sidebar" class="sidebar">

    <div class="sidebar-hdr">
      <span class="sidebar-hdr-label" id="sidebar-count-label">Sessions</span>
      <button class="sidebar-hdr-btn" id="sidebar-gear-btn" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="2" y1="5" x2="16" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="13" x2="16" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="6" cy="5" r="2" fill="var(--bg)" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="9" r="2" fill="var(--bg)" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="13" r="2" fill="var(--bg)" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="sidebar-hdr-btn" id="sidebar-close-btn" aria-label="Close">✕</button>
    </div>

    <button id="new-session-btn" class="sidebar-new-btn">＋ New conversation</button>

    <div id="session-list" class="session-list"></div>

    <div class="sidebar-footer">
      <div class="sidebar-persona-avatar" id="sidebar-avatar">S</div>
      <div class="sidebar-footer-info">
        <div class="sidebar-footer-name" id="sidebar-persona-name">Spark</div>
        <div class="sidebar-footer-model">v0.3.0 · deepseek-chat</div>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
